# Daily snapshot of Steam's Top Wishlists ordering.
#
# Reading the ordering costs 50-odd requests, so one runner reads it once a day
# and the result ships as a 30 KB file every user downloads from a CDN, rather
# than every installed copy of the extension hitting an undocumented endpoint.
#
# Output goes to the `data` branch, which is orphaned from `main`, so a daily
# commit of a regenerated file does not become most of this repo's history.
#
# If the snapshots go quiet: GitHub disables scheduled workflows in public
# repositories after 60 days with no activity, and commits pushed by this job
# with GITHUB_TOKEN do not reliably count as activity. Re-enable it in the
# Actions tab or fire it once with workflow_dispatch.

name: wishlist-ranks

on:
  schedule:
    # 03:17 UTC. Off the hour on purpose: GitHub queues scheduled jobs longer
    # at :00, when every cron in the world fires.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Queue instead of cancelling. Two runs writing the same branch would race for
# the push, and a cancelled run is simply a lost day.
concurrency:
  group: wishlist-ranks
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The anchor archive is cumulative, so it has to come back from the data
      # branch before anything appends to it. A missing branch is the normal
      # state of the first run.
      #
      # Written to a temp path and moved into place only when git show
      # succeeded, so a failed read leaves any existing archive alone.
      - name: Restore the anchor archive
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            if git show FETCH_HEAD:wishlist-anchors.ndjson > data/anchors.restore.tmp; then
              mv data/anchors.restore.tmp data/wishlist-anchors.ndjson
              echo "restored $(wc -l < data/wishlist-anchors.ndjson) anchors from the data branch"
            else
              rm -f data/anchors.restore.tmp
              echo "no anchor archive on the data branch yet"
            fi
          else
            echo "no data branch yet; starting from empty"
          fi

      # Fails loudly and writes nothing if the ordering came back short. A
      # truncated list does not look broken downstream — it looks like a store
      # where fewer games are wishlisted, which moves every percentile.
      - name: Snapshot the ordering
        run: node tools/crawl-wishlist-ranks.mjs --out data/wishlist-ranks.json --delay 1500

      # The whole ordering, every day, at 400ms a game — about 2.5 requests a
      # second against a keyless Valve endpoint. Yield falls from a quarter of
      # games at the head to one in twenty-five near the bottom, which is why
      # the tail is scanned rather than skipped.
      #
      # Non-fatal, and deadlined well under the job timeout: Steam throttling
      # the news API must not cost the ranks file, and the harvester appends as
      # it goes, so a short run keeps everything it found.
      - name: Harvest disclosures
        continue-on-error: true
        run: |
          node tools/harvest-anchors.mjs --ranks data/wishlist-ranks.json \
            --out data/wishlist-anchors.ndjson --delay 400 --deadline 90

      # The archive cut to the bytes an extension needs: the newest figure each
      # developer published about their own game, one line each.
      - name: Condense the disclosures
        continue-on-error: true
        run: |
          node tools/condense-anchors.mjs --anchors data/wishlist-anchors.ndjson --out data/wishlist-said.json

      # Reports; never blocks. Refits the model from today's archive and says
      # whether the shipped constants still reproduce. A person reads this.
      - name: Refit the model against today's archive
        continue-on-error: true
        run: node tools/calibrate-wishlist-model.mjs

      # Runs whatever the steps above did, as long as there is an ordering to
      # publish. The three outputs have independent value.
      #
      # This reads the data branch an hour after the restore step did, so the
      # anchors are merged into the branch copy on the dedupe key. Anything
      # committed in between survives.
      - name: Publish to the data branch
        if: always()
        run: |
          set -euo pipefail

          if [ ! -f data/wishlist-ranks.json ]; then
            echo "no ordering was written; nothing to publish"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git worktree add publish FETCH_HEAD
            git -C publish checkout -B data
          else
            git worktree add --detach publish
            git -C publish checkout --orphan data
            git -C publish rm -rf --cached . >/dev/null 2>&1 || true
            find publish -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          fi

          cp data/wishlist-ranks.json publish/

          if [ -f data/wishlist-anchors.ndjson ]; then
            node tools/merge-anchors.mjs \
              --into publish/wishlist-anchors.ndjson \
              --from data/wishlist-anchors.ndjson
          fi

          if [ -f data/wishlist-said.json ]; then
            cp data/wishlist-said.json publish/
          fi

          cd publish
          git add -A
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "ranks: $(date -u +%F)"
            git push origin data
          fi
