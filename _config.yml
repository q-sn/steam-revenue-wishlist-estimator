# GitHub Pages, built from the root of main by GitHub's own Jekyll.
#
# It exists for the Chrome Web Store listing: the store checks its homepage,
# support and privacy-policy links by fetching them, and github.com repository
# pages answer automated fetches with 504s often enough to block a submission.
# Pages is served from separate infrastructure. The Markdown files stay the
# single source — README.md becomes the index, PRIVACY.md /privacy/ and
# docs/SUPPORT.md /support/, so the site cannot drift from the repository.

title: Wishlytic
description: Steam revenue, units sold and wishlists on any store page, as sourced ranges.

defaults:
  - scope:
      path: PRIVACY.md
    values:
      permalink: /privacy/
  - scope:
      path: docs/SUPPORT.md
    values:
      permalink: /support/

# Code, generated tables and tooling: nothing a reader of the site needs.
exclude:
  - src
  - tools
  - test
  - _locales
  - manifest.json
  - package.json
  - LICENSE
